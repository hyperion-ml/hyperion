hyperion-train-wav2vec2transducer = "hyperion.bin.train_wav2vec2transducer:main"
hyperion-tables = "hyperion.bin.hyperion_tables:main"
hyperion-cluster-embeddings = "hyperion.bin.cluster_embeddings:main"
hyperion-accum-speech-quality-metrics = "hyperion.bin.accum_speech_quality_metrics:main"
hyperion-merge-trials = "hyperion.bin.merge_trials:main"
hyperion-eval-xvec-cosine-scoring-from-test-wav = "hyperion.bin.eval_xvec_cosine_scoring_from_test_wav:main"
hyperion-finetune-qvector = "hyperion.bin.finetune_qvector:main"
hyperion-train-verification-calibration = "hyperion.bin.train_verification_calibration:main"
hyperion-convert-vad-format = "hyperion.bin.convert_vad_format:main"
hyperion-eval-xvec-logits-from-wav = "hyperion.bin.eval_xvec_logits_from_wav:main"
