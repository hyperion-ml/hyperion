hyperion-finetune-xvector-from-wav = "hyperion.bin.finetune_xvector_from_wav:main"
hyperion-eval-plda-backend = "hyperion.bin.eval_plda_backend:main"
hyperion-extract-wav2xvectors = "hyperion.bin.extract_wav2xvectors:main"
hyperion-finetune-xvector-dfr-from-wav = "hyperion.bin.finetune_xvector_dfr_from_wav:main"
hyperion-apply-mvn-select-frames = "hyperion.bin.apply_mvn_select_frames:main"
hyperion-train-dac = "hyperion.bin.train_dac:main"
hyperion-train-freevc = "hyperion.bin.train_freevc:main"
