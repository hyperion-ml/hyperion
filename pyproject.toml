hyperion-prepare-data = "hyperion.bin.prepare_data:main"
hyperion-train-xvector-from-wav = "hyperion.bin.train_xvector_from_wav:main"
hyperion-train-lgbe = "hyperion.bin.train_lgbe:main"
hyperion-eval-xvec-cosine-scoring-from-transfer-art-test-wav = "hyperion.bin.eval_xvec_cosine_scoring_from_transfer_art_test_wav:main"
hyperion-merge-scores = "hyperion.bin.merge_scores:main"
hyperion-eval-wav2xvector-logits = "hyperion.bin.eval_wav2xvector_logits:main"
hyperion-adv-finetune-xvector-from-wav = "hyperion.bin.adv_finetune_xvector_from_wav:main"
hyperion-plot-embedding-tsne = "hyperion.bin.plot_embedding_tsne:main"
hyperion-compute-energy-vad = "hyperion.bin.compute_energy_vad:main"
hyperion-finetune-wav2xvector = "hyperion.bin.finetune_wav2xvector:main"
hyperion-train-qvector = "hyperion.bin.train_qvector:main"
hyperion-eval-verification-calibration = "hyperion.bin.eval_verification_calibration:main"
hyperion-eval-wav2vec2xvector-logits = "hyperion.bin.eval_wav2vec2xvector_logits:main"
