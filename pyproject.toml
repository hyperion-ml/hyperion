[build-system]
requires = [ "setuptools>=68", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "hyperion-ml"
dynamic = [ "version",]
description = "Toolkit for speaker recognition"
readme = "README.md"
keywords = [ "speaker recognition", "adversarial attacks", "NIST SRE", "x-vectors",]
requires-python = ">=3.10"
dependencies = [ "torch>=2.4.1,<=2.9.1", "torchaudio>=2.4.1,<=2.9.1", "torchvision>=0.19.1,<=0.24.1", "numpy>=1.26,<2.0", "pandas>=2.1,<2.3", "scipy>=1.11,<1.13", "scikit-learn>=1.4,<1.6", "matplotlib>=3.7.0,<3.11", "h5py>=3.11.0,<4.0", "soundfile>=0.13.1,<0.14", "transformers>=4.40,<5", "datasets>=3.0.0,<4.0", "tensorboard>=2.12,<2.21", "librosa>=0.10.1,<0.11", "lhotse>=1.30,<2.0", "sentencepiece>=0.2.0,<0.3", "kaldialign>=0.9.1,<1.0", "sphinx_rtd_theme>=0.4.3", "pympler", "memory_profiler", "gdown", "jsonargparse>=3.5.0", "wandb>=0.10.30", "isort", "black", "twine", "wheel", "loralib", "pytest", "toml", "hyperion-utmosv2==1.3.1", "pycountry>=24.0,<25.0", "langcodes>=3.3,<4.0", "nvidia-ml-py>=11.0.0,<14.0.0", "onnxruntime>=1.16.3,<1.19", "intervaltree>=3.1.0", "sortedcontainers>=2.4,<3.0", "pesq>=0.0.4,<0.1", "pystoi>=0.4.1,<0.5",]
[[project.authors]]
name = "Jesus Villalba"
email = "jesus.antonio.villalba@gmail.com"

[project.license]
text = "Apache-2.0"

[project.optional-dependencies]
torch24 = [ "torch==2.4.1", "torchaudio==2.4.1", "torchvision==0.19.1",]
torch25 = [ "torch>=2.5.1,<2.6", "torchaudio>=2.5.1,<2.6", "torchvision>=0.20.1,<0.21",]
torch26 = [ "torch>=2.6,<2.7", "torchaudio>=2.6,<2.7", "torchvision>=0.21,<0.22",]
torch27 = [ "torch>=2.7.1,<2.8", "torchaudio>=2.7.1,<2.8", "torchvision>=0.22.1,<0.23",]
torch28 = [ "torch>=2.8,<2.9", "torchaudio>=2.8,<2.9", "torchvision>=0.23,<0.24",]
torch29 = [ "torch==2.9.1", "torchaudio==2.9.1", "torchvision==0.24.1",]
gcc217 = [ "h5py==3.11.0", "onnxruntime==1.16.3", "numpy>=1.26,<2.0",]
onnx-cpu-modern = [ "onnxruntime>=1.18,<1.19",]
voxprofile = [ "hyperion-voxprofile==0.1.0",]
voxlect = [ "hyperion-voxlect==0.1.1",]
art = [ "adversarial-robustness-toolbox>=1.17",]

[project.urls]
Homepage = "https://github.com/hyperion-ml/hyperion"

[project.scripts]
hyperion-eval-speech-quality-metrics = "hyperion.bin.eval_speech_quality_metrics:main"
hyperion-train-qmf = "hyperion.bin.train_qmf:main"
hyperion-extract-xvectors-from-wav = "hyperion.bin.extract_xvectors_from_wav:main"
hyperion-make-wav2xvector = "hyperion.bin.make_wav2xvector:main"
hyperion-generate-adv-attacks-xvector-verif = "hyperion.bin.generate_adv_attacks_xvector_verif:main"
hyperion-train-wav2xvector = "hyperion.bin.train_wav2xvector:main"
hyperion-compute-mfcc-feats = "hyperion.bin.compute_mfcc_feats:main"
hyperion-eval-verification-metrics = "hyperion.bin.eval_verification_metrics:main"
hyperion-accum-voxprofile-metrics = "hyperion.bin.accum_voxprofile_metrics:main"
hyperion-copy-feats = "hyperion.bin.copy_feats:main"
hyperion-eval-xvec-cosine-scoring-from-adv-test-wav = "hyperion.bin.eval_xvec_cosine_scoring_from_adv_test_wav:main"
hyperion-extract-xvectors-slidwin-from-wav = "hyperion.bin.extract_xvectors_slidwin_from_wav:main"
hyperion-train-vi-emo-normalizer = "hyperion.bin.train_vi_emo_normalizer:main"
hyperion-submit = "hyperion.bin.hyperion_submit:main"
hyperion-train-verification-greedy-fusion = "hyperion.bin.train_verification_greedy_fusion:main"
hyperion-plot-embedding-tsne-per-class = "hyperion.bin.plot_embedding_tsne_per_class:main"
