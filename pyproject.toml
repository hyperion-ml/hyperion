[tool.isort]
profile = "black"
line_length = 88
skip_gitignore = true
extend_skip_glob = [ "hyp_utils/kaldi/**",]

[tool.setuptools.packages.find]
exclude = [ "tests",]

[tool.setuptools.dynamic.version]
attr = "hyperion.__version__"
