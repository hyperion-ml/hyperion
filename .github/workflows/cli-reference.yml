name: CLI Reference

on:
  pull_request:
    paths:
      - "hyperion/bin/**"
      - "docs/generate_cli_reference.py"
      - "docs/generated/cli-reference.rst"
      - "docs/cli_inventory.json"
      - "docs/requirements-cli-reference.txt"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/cli-reference.yml"
  push:
    branches: [master]
  schedule:
    - cron: "17 6 1 * *"

jobs:
  cli-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned CLI-reference runtime
        run: python -m pip install -r docs/requirements-cli-reference.txt
      - name: Check generated CLI option reference for drift
        run: >-
          python docs/generate_cli_reference.py --check
          --timeout 300 --jobs 4
      - name: Check CLI task-index and generated-help visibility
        run: python docs/check_cli_quality.py
      - name: Run representative CLI end-to-end checks
        run: python -m pytest tests/docs
