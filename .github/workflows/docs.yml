name: Documentation

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Check public API documentation coverage
        run: python docs/check_api_coverage.py
      - name: Check CLI classification coverage
        run: python docs/check_cli_coverage.py
      - name: Check generated CLI index for drift
        run: python docs/render_cli_index.py --check
      - name: Build strict HTML documentation
        run: HYPERION_PYTHON=python docs/build.sh html
      - name: Check external documentation links
        run: HYPERION_PYTHON=python docs/build.sh linkcheck

  cli-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned CLI-reference runtime
        run: python -m pip install -r docs/requirements-cli-reference.txt
      - name: Check generated CLI option reference for drift
        run: >-
          python docs/generate_cli_reference.py --check --allow-unavailable
          --timeout 90 --jobs 4
      - name: Run representative CLI end-to-end checks
        run: python -m pytest tests/docs/test_cli_end_to_end.py
