data:
  train:
    dataset:
      class_names:
      - speaker
      aug_cfgs:
      - conf/reverb_noise_tel_codecs_1_aug.yaml
      enable_tel_codecs_if: "source_type != 'cts'"
      return_segment_info:
      - speaker
      num_augs: 1
      wav_scale: 1.
      target_sample_freq: 16000
    sampler:
      sampler_type: seg_chunk_sampler
      min_batch_size: 64
      max_chunk_length: 3.0
      min_chunk_length: 3.0
      max_batches_per_epoch: 5000
    data_loader:
      num_workers: 8
  val:
    dataset:
      class_names:
      - speaker
      aug_cfgs:
      - conf/reverb_noise_tel_codecs_1_aug.yaml
      enable_tel_codecs_if: "source_type != 'cts'"
      return_segment_info:
      - speaker
      wav_scale: 1.
      target_sample_freq: 16000
    sampler:
      # sampler_type: seg_chunk_sampler
      sampler_type: class_weighted_random_seg_chunk_sampler
      # min_batch_size: 32
      min_batch_size: 128
      max_chunk_length: 2.0
      min_chunk_length: 2.0
      num_chunks_per_seg_epoch: 2
      class_name: speaker
      seg_weight_mode: uniform
    data_loader:
      num_workers: 8
model: wav2vec2xlsr300m_ecapatdnn1024x3_v2.0.yaml
trainer:
  optim:
    opt_type: sgd
    lr: 0.4
    momentum: 0.9
    weight_decay: 4e-4
  lrsched:
    lrsch_type: exp_lr
    decay_rate: 0.5
    decay_steps: 10000
    hold_steps: 3500
    #min_lr: 4e-4
    min_lr: 1e-6
    warmup_steps: 3500
    update_lr_on_opt_step: true
  use_amp: true
  log_interval: 1000
  epochs: 55
  eff_batch_size: 1024
  target_key: speaker
  train_mode: hf-feats-frozen-nograd
 