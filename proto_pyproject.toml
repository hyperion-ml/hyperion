[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperion-ml"
dynamic = ["version"]
authors = [
    { name = "Jesus Villalba", email = "jesus.antonio.villalba@gmail.com" }
]
description = "Toolkit for speaker recognition"
readme = "README.md"
keywords = ["speaker recognition", "adversarial attacks", "NIST SRE", "x-vectors"]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = []  # This should be dynamically loaded from requirements.txt

[project.optional-dependencies]
# Force a specific PyTorch series when you need to override the default range.
torch24 = [
  "torch==2.4.1",
  "torchaudio==2.4.1",
  "torchvision==0.19.1",
]

torch25 = [
  "torch>=2.5.1,<2.6",
  "torchaudio>=2.5.1,<2.6",
  "torchvision>=0.20.1,<0.21",
]

torch26 = [
  "torch>=2.6,<2.7",
  "torchaudio>=2.6,<2.7",
  "torchvision>=0.21,<0.22",
]

torch27 = [
  "torch>=2.7.1,<2.8",
  "torchaudio>=2.7.1,<2.8",
  "torchvision>=0.22.1,<0.23",
]

torch28 = [
  "torch>=2.8,<2.9",
  "torchaudio>=2.8,<2.9",
  "torchvision>=0.23,<0.24",
]

torch29 = [
  "torch==2.9.1",
  "torchaudio==2.9.1",
  "torchvision==0.24.1",
]

torch210 = [
  "torch==2.10.0",
  "torchvision==0.25.0",
  "torchaudio==2.10.0",
]

torch211 = [
  "torch==2.11.0",
  "torchvision==0.26.0",
  "torchaudio==2.11.0",
]

torch212 = [
  "torch==2.12.1",
  "torchvision==0.27.1",
  "torchaudio==2.11.0",
]

torch213 = [
  "torch==2.13.0",
  "torchvision==0.28.0",
  "torchaudio==2.11.0",
]

torch214 = [
  "torch==2.14.1",
  "torchvision==0.29.1",
  "torchaudio==2.11.0",
]

torch215 = [
  "torch==2.15.0",
  "torchvision==0.29.2",
  "torchaudio==2.11.0",
]

gcc217 = [
  "h5py==3.11.0",              # manylinux_2_17 wheels
  "onnxruntime==1.16.3",       # last manylinux_2_17 wheel
  "numpy>=1.26,<2.0",          # compatible ABI for PyTorch 2.4.1
]

# Opt into newer ORT on modern OS (glibc >= 2.28)
onnx-cpu-modern = ["onnxruntime>=1.18,<1.19"]

voxprofile = ["hyperion-voxprofile==0.1.0"]

voxlect = ["hyperion-voxlect==0.1.1"]

art = ["adversarial-robustness-toolbox>=1.17"]

[project.urls]
Homepage = "https://github.com/hyperion-ml/hyperion"

[project.scripts]
# These should be dynamically generated from the bin directory

[tool.setuptools]
packages = { find = { exclude = ["tests"] } }

[tool.setuptools.dynamic]
version = { attr = "hyperion.__version__" }

[tool.isort]
profile = "black"
line_length = 88
skip_gitignore = true
extend_skip_glob = ["hyp_utils/kaldi/**"]

#[tool.setuptools.entry-points]
#"console_scripts" = []  # Dynamically populated from hyperion/bin
